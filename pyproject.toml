[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticflow-ai"
version = "1.0.0"
description = "Enterprise Multi-Agent Workflows, LangGraph Architectures & Autonomous AI Systems"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Nachiket Gadilohar", email = "nachiketlohar0306@gmail.com" }
]
keywords = [
    "langgraph",
    "langchain",
    "agentic-ai",
    "multi-agent-systems",
    "ai-agents",
    "rag",
    "llm",
    "python"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "tavily-python>=0.5.0",
    "pypdf>=4.0.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/nachiket0987/agenticflow-ai"
Repository = "https://github.com/nachiket0987/agenticflow-ai"
Documentation = "https://github.com/nachiket0987/agenticflow-ai#readme"
